<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0079bf"/>
      <stop offset="1" stop-color="#5067bf"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6def5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#091e42" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- P monogram with integrated kanban board -->
  <g filter="url(#shadow)">
    <!-- Left stem (also the first board column) -->
    <rect x="152" y="124" width="52" height="264" rx="18" fill="url(#mark)"/>

    <!-- Top bowl of P -->
    <path d="M204 124 h96 a88 88 0 0 1 0 176 h-96 z" fill="url(#mark)"/>

    <!-- Inner counter: mini kanban board (2 columns with cards) -->
    <rect x="240" y="172" width="30" height="80" rx="6" fill="#0079bf" opacity="0.7"/>
    <rect x="278" y="172" width="30" height="56" rx="6" fill="#0079bf" opacity="0.5"/>
    <rect x="240" y="260" width="30" height="20" rx="5" fill="#0079bf" opacity="0.3"/>
  </g>

  <!-- Check dot accent (completion / planning done) -->
  <circle cx="368" cy="360" r="22" fill="#ffffff"/>
  <path d="M360 360 l6 7 l13 -15"
        fill="none"
        stroke="#0079bf"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
